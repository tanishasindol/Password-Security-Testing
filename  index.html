<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🔐 Password Strength Checker</h1>
    <p>Check how secure your password is.</p>
<div class="input-box">
    <input type="password" id="password" placeholder="Enter your password">
    <button onclick="togglePassword()">Show</button>
</div>
<div class="strength-bar">
    <div id="strength"></div>
</div>
<h3 id="result">Password strength: Not checked</h3>
<div class="tips">
    <h3>Security Requirements</h3>
    <p id="length">❌ At least 8 characters</p>
    <p id="upper">❌ One uppercase letter</p>
    <p id="lower">❌ One lowercase letter</p>
    <p id="number">❌ One number</p>
    <p id="special">❌ One special character</p>
</div>
<button class="check-btn" onclick="checkPassword()">Check Password</button>
</div>
<script src="script.js"></script>
</body>
</html>
